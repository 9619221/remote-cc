<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #1d1d1f; --ink2: #3a3a3c; --muted: #6e6e73; --faint: #a1a1a6;
    --glass: rgba(255,255,255,.62); --glass-line: rgba(255,255,255,.75);
    --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff3b30; --track: rgba(0,0,0,.07);
    --accent: #d97757;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased;
         font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; font-variant-numeric: tabular-nums;
         background:
           radial-gradient(circle at 12% 18%, #ffd9c7, transparent 42%),
           radial-gradient(circle at 88% 26%, #c9dcff, transparent 44%),
           radial-gradient(circle at 50% 105%, #d8f3e3, transparent 50%),
           #eef0f5;
         background-attachment: fixed; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 5px; border: 3px solid transparent; background-clip: content-box; }
  .glass { background: var(--glass); backdrop-filter: blur(24px) saturate(1.6); border: 1px solid var(--glass-line); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 600;
           color: var(--blue); background: rgba(10,132,255,.1); transition: background .15s, transform .1s; }
  button:hover { background: rgba(10,132,255,.17); }
  button:active { transform: scale(.96); }
  button.solid { background: var(--blue); color: #fff; }
  button.solid:hover { background: #0077ed; }
  button.plain { background: rgba(255,255,255,.7); color: var(--ink2); }
  button.plain:hover { background: #fff; }
  button.danger { color: var(--red); background: rgba(255,59,48,.1); }

  /* 顶栏要有底色：不然往下滚时，标题会和下面的列表叠在一起 */
  header { position: sticky; top: 0; z-index: 3; padding: 20px 26px 10px;
           background: rgba(238,240,245,.82); backdrop-filter: blur(20px) saturate(1.6); border-bottom: 1px solid rgba(0,0,0,.05); }
  .fdlist { max-height: 360px; overflow-y: auto; border-radius: 12px; background: rgba(255,255,255,.7); }
  .fd { display: block; width: 100%; text-align: left; border-radius: 0; background: none; color: var(--ink); padding: 9px 12px; border-top: 1px solid rgba(0,0,0,.05); font-weight: 400; }
  .fd:first-child { border-top: 0; }
  .fd:hover { background: rgba(10,132,255,.08); }
  .fd b { display: block; font-size: 14px; font-weight: 600; }
  .fd span { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kind { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: rgba(0,0,0,.06); margin: 8px 0 4px; }
  .kind a { flex: 1; text-align: center; padding: 5px 0; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .kind a.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .bar1 { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; cursor: pointer; flex: none; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
  .logo:active { transform: scale(.85) rotate(-25deg); }
  h1 { margin: 0; font: 700 26px/1.1 "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif; letter-spacing: -.02em; }
  .summary { color: var(--muted); font-size: 13px; margin-left: 4px; align-self: flex-end; padding-bottom: 2px; }
  .summary .bad { color: var(--red); font-weight: 600; }
  .sp { flex: 1; }
  #updated { color: var(--faint); font-size: 12px; }
  .seg { display: inline-flex; margin-top: 16px; padding: 3px; border-radius: 10px; background: rgba(0,0,0,.06); }
  .seg a { padding: 4px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all .2s; }
  .seg a.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  main { padding: 4px 26px 30px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 10px 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }

  .card { position: relative; overflow: hidden; border-radius: 24px; padding: 18px 18px 14px;
          box-shadow: 0 10px 30px -14px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
          animation: pop .5s cubic-bezier(.2,.9,.3,1.2) both; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -16px rgba(0,0,0,.3); }
  .card::after { content: ""; position: absolute; inset: 0; pointer-events: none; transform: translateX(-120%);
                 background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.8) 50%, transparent 62%); }
  .card:hover::after, .card.sweep::after { animation: sweep 1.1s ease; }
  @keyframes sweep { to { transform: translateX(120%); } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  .name { display: flex; align-items: center; gap: 7px; }
  .name b { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .plan { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .def { font-size: 11px; font-weight: 600; color: #fff; background: var(--blue); border-radius: 10px; padding: 0 8px; }
  .email { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 6px; }

  .gs { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
  .rings { position: relative; width: 92px; height: 92px; flex: none; }
  .rings svg { position: absolute; transform: rotate(-90deg); }
  .rings .fg { stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1), stroke .3s; }
  .legend { display: grid; gap: 8px; min-width: 0; }
  .legend b { display: block; font: 700 21px/1.1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.02em; }
  .legend span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .msg { margin-top: 14px; font-size: 13px; color: var(--muted); padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.5); }
  .msg.warn { color: #b25d00; background: rgba(255,159,10,.12); }
  .act { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .act .solid { margin-left: auto; }

  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
  .stat { border-radius: 18px; padding: 14px 16px 10px; }
  .stat .sh { display: flex; align-items: baseline; gap: 8px; }
  .stat .sh b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  .stat .sh span { flex: none; font-size: 12.5px; color: var(--muted); }
  .stat .sh em { font-style: normal; font-weight: 700; color: var(--blue); }
  .bars { display: flex; gap: 8px; height: 80px; margin-top: 10px; }
  .bc { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .bc i { width: 100%; max-width: 30px; min-height: 2px; border-radius: 5px 5px 2px 2px; background: var(--blue); opacity: .8; }
  .bc:last-child i { background: var(--green); opacity: 1; }
  .bc span { font-size: 11px; color: var(--faint); }
  .running { border-radius: 20px; margin-bottom: 14px; overflow: hidden; animation: pop .4s both; }
  .running .hd { display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .run { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid rgba(0,0,0,.05); }
  .run .st { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
  .run .st.busy { background: var(--orange); animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .run .who { font-weight: 600; font-size: 13px; flex: none; }
  .run .t { flex: 1; min-width: 0; font-size: 13px; }
  .run .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .t .m2 { font-size: 12px; color: var(--faint); }
  .run .to { display: flex; gap: 6px; flex: none; opacity: .0; transform: translateX(6px); transition: opacity .2s, transform .2s; }
  .run:hover .to, .run .to:focus-within { opacity: 1; transform: none; }
  .pill { font-size: 12.5px; padding: 4px 12px; }
  .pill.warn { color: var(--orange); background: rgba(255,159,10,.14); }
  .search { width: 100%; font: inherit; color: var(--ink); padding: 10px 14px; border-radius: 14px; margin-top: 8px; outline: none; }
  .search:focus { border-color: rgba(10,132,255,.5); box-shadow: 0 0 0 4px rgba(10,132,255,.12); }
  .hint { font-size: 12.5px; color: var(--muted); }
  .sessbox { border-radius: 20px; margin-top: 12px; overflow: hidden; }
  .sess { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid rgba(0,0,0,.05); transition: background .15s; }
  .sess:first-child { border-top: 0; }
  .sess:hover { background: rgba(255,255,255,.5); }
  .sess .t { flex: 1; min-width: 0; }
  .sess .t div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .sess .m2 { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select { font: inherit; font-size: 13px; color: var(--ink2); padding: 4px 8px; border: 0; border-radius: 9px; background: rgba(255,255,255,.8); }

  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.18); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 5; }
  .mask.show { display: flex; }
  .dialog { background: rgba(255,255,255,.85); backdrop-filter: blur(30px) saturate(1.6); border-radius: 22px; padding: 22px; width: 360px;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); animation: pop .3s cubic-bezier(.2,.9,.3,1.2) both; }
  .dialog h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .dialog label { display: block; font-size: 12.5px; color: var(--muted); margin-top: 12px; }
  .dialog input { width: 100%; font: inherit; color: var(--ink); padding: 8px 11px; border: 0; border-radius: 11px; margin-top: 4px; background: rgba(0,0,0,.05); outline: none; }
  .dialog input:focus { box-shadow: 0 0 0 3px rgba(10,132,255,.3); }
  .dialog .row { display: flex; gap: 6px; margin-top: 20px; }
  .dialog .hint { margin-top: 12px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 10px) scale(.96); background: rgba(30,30,32,.86); backdrop-filter: blur(20px);
           color: #fff; padding: 9px 18px; border-radius: 999px; font-size: 13px; opacity: 0; transition: all .25s cubic-bezier(.2,.9,.3,1.2); pointer-events: none; z-index: 9; }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* 彩蛋：Clawd 巡逻 */
  .clawd { position: fixed; bottom: 14px; left: -80px; z-index: 8; width: 4px; height: 4px; pointer-events: none; animation: patrol 7s linear forwards; }
  .clawd i { position: absolute; width: 4px; height: 4px; color: var(--accent); animation: hop .3s steps(2) infinite;
             box-shadow:
             4px 0,8px 0,12px 0,16px 0,20px 0,24px 0,28px 0,32px 0,36px 0,
             0 4px,4px 4px,8px 4px,16px 4px,20px 4px,28px 4px,32px 4px,36px 4px,40px 4px,
             -4px 8px,0 8px,4px 8px,8px 8px,12px 8px,16px 8px,20px 8px,24px 8px,28px 8px,32px 8px,36px 8px,40px 8px,44px 8px,
             0 12px,4px 12px,8px 12px,12px 12px,16px 12px,20px 12px,24px 12px,28px 12px,32px 12px,36px 12px,40px 12px,
             4px 16px,12px 16px,28px 16px,36px 16px; }
  @keyframes patrol { to { left: calc(100% + 80px); } }
  @keyframes hop { 50% { transform: translateY(-3px); } }
</style>
</head>
<body>
<header>
  <div class="bar1">
    <svg class="logo" viewBox="0 0 32 32" onclick="egg()">
      <rect width="32" height="32" rx="8" fill="#fff"/>
      <circle cx="16" cy="16" r="10.5" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="3.5"/>
      <circle cx="16" cy="16" r="10.5" fill="none" stroke="#30d158" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="46 66" transform="rotate(-90 16 16)"/>
      <circle cx="16" cy="16" r="6" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="3.5"/>
      <circle cx="16" cy="16" r="6" fill="none" stroke="#0a84ff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="16 38" transform="rotate(-90 16 16)"/></svg>
    <h1>Claude 账户</h1>
    <span class="summary" id="summary"></span>
    <span class="sp"></span>
    <span id="updated"></span>
    <button class="plain" onclick="showMobile()">手机</button>
    <button class="plain" onclick="refresh()">刷新</button>
    <button class="solid" onclick="openEdit()">新增账号</button>
  </div>
  <div class="seg"><a class="on" data-tab="list" onclick="tab('list')">账号</a><a data-tab="sessions" onclick="tab('sessions')">历史会话</a><a data-tab="stats" onclick="tab('stats')">用量</a></div>
</header>
<main id="accounts"><div id="running"></div><div id="list"></div><div id="codex"></div></main>
<main id="stats" hidden><div id="statsBody"></div></main>
<main id="sessions" hidden>
  <input id="q" class="search glass" placeholder="搜索对话内容或文件夹" oninput="renderSessions()">
  <div class="hint" style="margin:8px 0 0 4px">各号共享同一份对话记录：一个号额度满了，可以换别的号接着聊。</div>
  <div id="sessList"></div>
</main>

<div class="mask" id="mask">
  <div class="dialog">
    <h3 id="dlgTitle"></h3>
    <div class="kind" id="fKindRow"><a data-k="claude" onclick="setKind('claude')">Claude</a><a data-k="codex" onclick="setKind('codex')">Codex（ChatGPT）</a></div>
    <label>名字<input id="fName" placeholder="例如：工作号"></label>
    <label class="cl">分组<input id="fGroup" placeholder="例如：工作 / 个人，可不填"></label>
    <label class="cl">备注<input id="fNote" placeholder="可不填"></label>
    <div class="hint" id="dlgHint"></div>
    <div class="row">
      <button class="danger" id="btnDel" onclick="delAcc()">删除</button>
      <span class="sp"></span>
      <button class="plain" onclick="closeEdit()">取消</button>
      <button class="solid" onclick="saveAcc()">保存</button>
    </div>
  </div>
</div>
<div class="mask" id="fdMask" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="dialog">
    <h3>在哪个文件夹开终端</h3>
    <div class="hint" style="margin-bottom:8px">最近用 Claude / Codex 干活的项目，越靠上越近</div>
    <div id="fdList" class="fdlist"></div>
    <div class="row"><span class="sp"></span><button class="plain" onclick="$('fdMask').classList.remove('show')">取消</button></div>
  </div>
</div>
<div class="mask" id="mMask" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="dialog" style="text-align:center">
    <h3>用手机看终端、回复 Claude</h3>
    <div class="hint" style="margin:4px 0 12px">用手机相机扫码打开；可以「添加到主屏幕」当 App 用</div>
    <div id="mQr" style="width:200px;height:200px;margin:0 auto;background:#fff;border-radius:14px;padding:8px"></div>
    <div class="hint" id="mUrl" style="margin-top:10px;word-break:break-all;user-select:text"></div>
    <div class="hint" id="mTs" style="margin-top:8px;word-break:break-all;user-select:text"></div>
    <div class="row" style="justify-content:center"><button class="solid" onclick="$('mMask').classList.remove('show')">好的</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
let accounts = [], usage = {}, editing = null, delArmed = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg) {
  $('toast').textContent = msg; $('toast').classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('show'), 2400);
}

// 倒计时：一天内显示 时:分:秒，超过一天显示 天+小时
function countdown(iso) {
  if (!iso) return '';
  let s = Math.max(0, Math.floor((new Date(iso) - Date.now()) / 1000));
  if (s === 0) return '已重置';
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const p = n => String(n).padStart(2, '0');
  return d ? `${d}天${h}小时` : `${p(h)}:${p(m)}:${p(sec)}`;
}
// 外圈（5 小时）按用量变色；内圈（每周）平时蓝色，快满才变红
const outerColor = p => p >= 90 ? 'var(--red)' : p >= 70 ? 'var(--orange)' : 'var(--green)';
const innerColor = p => p >= 90 ? 'var(--red)' : 'var(--blue)';

function arc(p, size, sw, color, inset) {
  const r = (size - sw) / 2, C = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" style="left:${inset}px;top:${inset}px">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
    <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - p / 100)}"/></svg>`;
}

function line(label, m, color) {
  const p = Math.min(100, Math.round(m.percent));
  const r = m.resets_at ? `<span data-reset="${m.resets_at}">${countdown(m.resets_at)}</span>后重置` : '未开始计时';
  return `<div><b style="color:${color}">${p}%</b><span>${label} · ${r}</span></div>`;
}

function card(a, i) {
  const u = usage[a.id];
  let body;
  if (!u) body = '<div class="msg">读取用量中…</div>';
  else if (u.error) body = `<div class="msg warn">${esc(u.error)}</div>`;
  else {
    const h = u.five_hour?.percent ?? 0, w = u.seven_day?.percent ?? 0;
    body = `<div class="gs"><div class="rings">${arc(h, 92, 11, outerColor(h), 0)}${arc(w, 62, 11, innerColor(w), 15)}</div>
      <div class="legend">${u.five_hour ? line('5 小时', u.five_hour, outerColor(h)) : ''}${u.seven_day ? line('每周', u.seven_day, innerColor(w)) : ''}</div></div>`;
  }
  const org = a.org && !/'s Organization$/.test(a.org) ? ' · ' + esc(a.org) : '';
  return `<div class="card glass" style="animation-delay:${i * 60}ms">
    <div class="name"><b>Claude · ${esc(a.name)}</b>${a.plan ? `<span class="plan">${esc(a.plan.toUpperCase())}</span>` : ''}${a.is_default ? '<span class="def">默认</span>' : ''}</div>
    <div class="email">${a.email ? esc(a.email) + org : '命令行未登录：点「开终端」登录'}</div>
    ${a.note ? `<div class="note">${esc(a.note)}</div>` : ''}
    ${body}
    <div class="act">
      <button onclick="act('open_web','${a.id}','正在打开网页…')">网页</button>
      <button onclick="act('open_web_usage','${a.id}','正在打开网页用量…')">网页用量</button>
      ${a.is_default ? '' : `<button title="之后任何地方新开的 claude 都用这个号" onclick="setDefault('${a.id}')">设为默认</button>`}
      <button onclick="openEdit('${a.id}')">编辑</button>
      <button class="solid" onclick="pickFolder('claude', '${a.id}')">开终端</button>
    </div></div>`;
}

function renderSummary() {
  const ready = accounts.filter(a => { const u = usage[a.id]; return u && !u.error && (u.five_hour?.percent ?? 0) < 100 && (u.seven_day?.percent ?? 0) < 100; });
  const next = accounts.map(a => usage[a.id]).filter(u => u && !u.error)
    .flatMap(u => [u.five_hour, u.seven_day]).filter(m => m && m.percent >= 100 && m.resets_at)
    .map(m => m.resets_at).sort()[0];
  const parts = [`${accounts.length} 个账号`];
  if (Object.keys(usage).length) parts.push(`${ready.length} 个可用`);
  if (next) parts.push(`<span class="bad"><span data-reset="${next}">${countdown(next)}</span> 后有号恢复</span>`);
  $('summary').innerHTML = parts.join(' · ');
}

function render() {
  const groups = {};
  accounts.forEach(a => (groups[a.group || '未分组'] ||= []).push(a));
  const names = Object.keys(groups).sort((x, y) => (x === '未分组') - (y === '未分组') || x.localeCompare(y, 'zh'));
  let i = 0;
  // 只有一个分组时不显示分组标题，更干净
  $('list').innerHTML = names.map(g => `${names.length > 1 ? `<h2>${esc(g)}</h2>` : ''}<div class="grid">${groups[g].map(a => card(a, i++)).join('')}</div>`).join('');
  renderSummary();
  // 圆环从 0 转到实际用量
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll('.rings .fg').forEach(el => el.style.strokeDashoffset = el.dataset.off)));
}

// ---------- Codex 的号（和手机上一样）：中转号按 Key 扣钱；ChatGPT 号能看额度，没登录的点「登录」开终端走设备码登录 ----------
let codexAccs = [];
async function loadCodex() {
  codexAccs = await pywebview.api.codex_accounts();
  $('codex').innerHTML = `<h2>Codex</h2><div class="grid">${codexAccs.map((a, i) => {
    const u = a.usage || {};
    let body;
    if (a.relay) body = '<div class="msg">走 API Key 中转，按 Key 扣费，没有额度限制</div>';
    else if (!a.logged) body = '<div class="msg warn">还没登录：点「登录」，会在这个号自己的 Chrome 里打开登录页，验证码已自动复制，粘贴进去就行</div>';
    else if (u.error) body = `<div class="msg warn">${esc(u.error)}</div>`;
    else {
      const h = u.five_hour?.percent ?? 0, w = u.seven_day?.percent ?? 0;
      body = `<div class="gs"><div class="rings">${arc(h, 92, 11, outerColor(h), 0)}${arc(w, 62, 11, innerColor(w), 15)}</div>
        <div class="legend">${u.five_hour ? line('5 小时', u.five_hour, outerColor(h)) : ''}${u.seven_day ? line('每周', u.seven_day, innerColor(w)) : ''}</div></div>`;
    }
    // 跟 Claude 的卡片一样：名字、套餐、默认、邮箱，下面一排 网页 / 网页用量 / 设为默认 / 编辑 / 开终端
    return `<div class="card glass" style="animation-delay:${i * 60}ms">
      <div class="name"><b>Codex · ${esc(a.name)}</b>${u.plan ? `<span class="plan">${esc(u.plan.toUpperCase())}</span>` : ''}${a.is_default ? '<span class="def">默认</span>' : ''}</div>
      <div class="email">${a.relay ? 'API Key 中转' : a.email ? esc(a.email) : '还没登录 ChatGPT'}</div>
      ${body}
      <div class="act">
        ${a.relay ? '' : `<button onclick="codexWeb('${a.id}')">网页</button><button onclick="codexWebUsage('${a.id}')">网页用量</button>`}
        ${a.is_default ? '' : `<button title="之后任何地方新开的 codex 都用这个号" onclick="codexDefault('${a.id}')">设为默认</button>`}
        ${a.relay ? '' : `<button onclick="openEdit('${a.id}', 'codex')">编辑</button>`}
        ${a.logged ? `<button class="solid" onclick="pickFolder('codex', '${a.id}')">开终端</button>` : `<button class="solid" onclick="codexLogin('${a.id}')">登录</button>`}
      </div></div>`;
  }).join('')}</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll('#codex .rings .fg').forEach(el => el.style.strokeDashoffset = el.dataset.off)));
}
async function codexWebUsage(id) {
  try { await pywebview.api.codex_web_usage(id); toast('正在打开网页用量…'); } catch (e) { toast('出错了：' + e); }
}
async function codexDefault(id) {
  await pywebview.api.codex_set_default(id); await loadCodex();
  toast('已设为默认：之后新开的终端里敲 codex 都用这个号');
}
async function codexWeb(id) {
  try { await pywebview.api.codex_web(id); toast('正在用这个号的 Chrome 打开 ChatGPT…'); } catch (e) { toast('出错了：' + e); }
}
async function codexLogin(id) {
  toast('正在生成验证码…');
  try {
    const r = await pywebview.api.codex_login(id);
    toast(`验证码 ${r.code} 已复制：在弹出的 Chrome 里登录 ChatGPT，粘贴验证码，点授权`);
    // 等你授权完：登录好了就刷新卡片
    const t = setInterval(async () => {
      const cx = await pywebview.api.codex_accounts();
      if (cx.find(a => a.id === id)?.logged) { clearInterval(t); toast('Codex 号登录好了'); loadCodex(); }
    }, 3000);
    setTimeout(() => clearInterval(t), 15 * 60 * 1000);
  } catch (e) { toast('出错了：' + e); }
}
// 开终端前先选在哪个文件夹（最近用过的项目，最后是用户目录），跟手机上一样
let folderFor = null;
async function pickFolder(kind, id) {
  folderFor = {kind, id};
  const dirs = await pywebview.api.recent_folders();
  $('fdList').innerHTML = dirs.map((d, i) => `<button class="fd" onclick="openIn(${i})"><b>${esc(d.split('\\').at(-1) || d)}</b><span>${esc(d)}</span></button>`).join('');
  $('fdList').dirs = dirs;
  $('fdMask').classList.add('show');
}
async function openIn(i) {
  const cwd = $('fdList').dirs[i], {kind, id} = folderFor;
  $('fdMask').classList.remove('show');
  try {
    if (kind === 'codex') await pywebview.api.launch_codex(id, cwd); else await pywebview.api.launch_cli(id, cwd);
    toast(`正在 ${cwd.split('\\').at(-1)} 里打开终端…`);
  } catch (e) { toast('出错了：' + e); }
}
setInterval(loadCodex, 60000);

setInterval(() => document.querySelectorAll('[data-reset]').forEach(el => el.textContent = countdown(el.dataset.reset)), 1000);

async function load() { accounts = await pywebview.api.list_accounts(); render(); }

// 后台每 5 分钟刷新一次后由 Python 推过来
function applyUsage(u) {
  usage = u; render();
  document.querySelectorAll('.card').forEach(c => { c.classList.remove('sweep'); void c.offsetWidth; c.classList.add('sweep'); });
  $('updated').textContent = new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) + ' 更新';
}

async function refresh() {
  $('updated').textContent = '刷新中…';
  accounts = await pywebview.api.list_accounts();
  applyUsage(await pywebview.api.usages());
}

async function act(fn, id, msg) {
  try { await pywebview.api[fn](id); toast(msg); } catch (e) { toast('出错了：' + e); }
}

async function setDefault(id) {
  await pywebview.api.set_default(id); await load();
  toast('已设为默认：之后新开的终端 / VS Code 都用这个号');
}

let sessions = [];
async function tab(name) {
  document.querySelectorAll('.seg a').forEach(a => a.classList.toggle('on', a.dataset.tab === name));
  $('accounts').hidden = name !== 'list'; $('sessions').hidden = name !== 'sessions'; $('stats').hidden = name !== 'stats';
  if (name === 'sessions') { sessions = await pywebview.api.list_sessions(); renderSessions(); }
  if (name === 'stats') renderStats(await pywebview.api.stats());
}

// 用量：每个号每天用掉周额度的几成；每个项目每天用了多少 token（和手机上的一样）
function last7() {
  return Array.from({length: 7}, (_, i) => { const d = new Date(Date.now() - (6 - i) * 86400000);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; });
}
const fmtTok = n => n >= 1e6 ? (n / 1e6).toFixed(1) + ' 百万' : n >= 1e4 ? Math.round(n / 1e4) + ' 万' : String(n);
function bars(days, vals) {
  const max = Math.max(1, ...days.map(d => vals[d] || 0));
  return `<div class="bars">${days.map((d, i) => `<div class="bc"><i style="height:${Math.round((vals[d] || 0) / max * 100)}%" title="${d}"></i>
    <span>${i === 6 ? '今天' : (+d.slice(5, 7)) + '/' + (+d.slice(8))}</span></div>`).join('')}</div>`;
}
function renderStats(s) {
  const days = last7(), today = days[6];
  const accs = Object.entries(s.names).map(([id, name]) => {
    const v = s.accounts.accounts?.[id] || {}, week = days.reduce((a, d) => a + (v[d] || 0), 0);
    return `<div class="stat glass"><div class="sh"><b>${esc(name)}</b><span>今天用掉周额度 <em>${Math.round(v[today] || 0)}%</em> · 7 天共 ${Math.round(week)}%</span></div>${bars(days, v)}</div>`;
  }).join('');
  const total = s.projects.reduce((a, p) => a + p.total, 0) || 1;
  const projs = s.projects.map(p => {
    const name = /^[A-Za-z]:\\Users\\[^\\]+$/.test(p.project) ? '用户目录（没进项目文件夹的）' : p.project.split('\\').at(-1) || p.project;
    return `<div class="stat glass"><div class="sh"><b title="${esc(p.project)}">${esc(name)}</b><span>${fmtTok(p.total)} · 占 ${Math.round(p.total / total * 100)}%</span></div>${bars(days, p.days)}</div>`;
  }).join('');
  $('statsBody').innerHTML = `<h2>各个号</h2><div class="sgrid">${accs}</div>
    <div class="hint" style="margin:6px 4px 0">${s.accounts.since ? '从 ' + s.accounts.since + ' 开始记录，之前的没有数据' : '刚开始记录，过一阵子才有数据'}</div>
    <h2>各个项目（按 token 算，近 7 天）</h2><div class="sgrid">${projs || '<div class="hint">没有数据</div>'}</div>
    <div class="hint" style="margin:6px 4px 0">token 是 Claude 读写的字数单位，数越大越费额度；不算「读缓存」那部分（很便宜）</div>`;
}

function fmtTime(t) {
  const d = new Date(t * 1000), now = new Date();
  const hm = d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
  return d.toDateString() === now.toDateString() ? `今天 ${hm}` : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}

function renderSessions() {
  const q = $('q').value.trim().toLowerCase();
  const list = sessions.filter(s => !q || (s.title + ' ' + s.cwd).toLowerCase().includes(q)).slice(0, 80);
  const def = (accounts.find(a => a.is_default) || {}).id || 'main';
  const opts = accounts.map(a => `<option value="${a.id}"${a.id === def ? ' selected' : ''}>Claude · ${esc(a.name)}</option>`).join('');
  $('sessList').innerHTML = list.length ? `<div class="sessbox glass">${list.map((s, i) => `<div class="sess">
      <div class="t"><div title="${esc(s.title)}">${esc(s.title)}</div>
        <div class="m2">${fmtTime(s.mtime)} · ${esc(s.cwd)}</div></div>
      <select id="sa${i}">${opts}</select>
      <button onclick="resume(${sessions.indexOf(s)}, 'sa${i}')">继续</button>
    </div>`).join('')}</div>` : '<div class="hint" style="margin-top:14px">没有找到对话</div>';
}

async function showMobile() {
  const m = await pywebview.api.mobile_info();
  $('mQr').innerHTML = m.qr.replace(/<\?xml[^>]*>/, '').replace('<svg', '<svg style="width:100%;height:100%"');
  $('mUrl').textContent = m.tailscale ? '二维码走 Tailscale（手机打开 Tailscale App 即可，在家在外都能用）：' + m.tailscale : '家里 Wi-Fi：' + m.url;
  $('mTs').textContent = '';
  $('mMask').classList.add('show');
}

// 正在运行的终端：可以直接换号，接着同一段对话
let running = [], armed = null;
async function loadRunning() {
  // 鼠标正放在某一行上（可能要点换号）时先不刷新，免得按钮跳走
  if ($('accounts').hidden || document.querySelector('.run:hover')) return;
  running = await pywebview.api.list_running();
  const st = s => s === 'busy' ? '回复中' : s === 'waiting' ? '等你确认' : '空闲';
  $('running').innerHTML = running.length ? `<div class="running glass">
    <div class="hd">正在运行 · ${running.length}</div>
    ${running.map((r, i) => `<div class="run">
      <span class="st${r.status === 'busy' ? ' busy' : ''}" title="${st(r.status)}"></span>
      <span class="who">${esc(r.acc_name)}</span>
      <div class="t"><div title="${esc(r.title)}">${esc(r.title || '（新对话）')}</div>
        <div class="m2">${st(r.status)}${r.cwd ? ' · ' + esc(r.cwd) : ''}${r.in_place ? '' : ' · 换号会新开窗口'}</div></div>
      <div class="to">${(r.kind === 'codexterm'
          // Codex 终端换到别的（登录了的）Codex 号；Claude 终端换到别的 Claude 号
          ? codexAccs.filter(a => 'cx:' + a.id !== r.acc && a.logged).map(a => ({id: 'cx:' + a.id, name: 'Codex·' + a.name}))
          : accounts.filter(a => a.id !== r.acc).map(a => ({id: a.id, name: 'Claude·' + a.name}))).map(a =>
        `<button class="pill" onclick="switchRun(${i}, '${a.id}', this)">换到 ${esc(a.name)}</button>`).join('')}
        <button class="pill danger" onclick="closeRun(${i}, this)">关闭</button></div>
    </div>`).join('')}</div>` : '';
}

// 关掉一个终端：连窗口一起关，对话记录还在
async function closeRun(i, btn) {
  const r = running[i];
  if (r.status === 'busy' && armed !== r.pid + 'close') {  // 正在回复时点两下才关
    armed = r.pid + 'close'; btn.textContent = '正在回复，再点一次'; btn.classList.add('warn'); return;
  }
  armed = null;
  try { await pywebview.api.close_terminal(r.pid); toast('已关闭，对话还能在「历史会话」里接着聊'); }
  catch (e) { toast('关闭失败：' + e); }
  setTimeout(loadRunning, 1500);
}

async function switchRun(i, to, btn) {
  const r = running[i];
  // 正在回复时要点第二次才切，免得把回复切断一半
  if (r.status === 'busy' && armed !== r.pid + to) {
    armed = r.pid + to; btn.textContent = '正在回复，再点一次'; btn.classList.add('warn'); return;
  }
  armed = null;
  try {
    const inPlace = to.startsWith('cx:') ? (await pywebview.api.switch_codex(r.pid, to.slice(3)), false)
      : await pywebview.api.switch_running(r.pid, to);
    toast(inPlace ? '正在原窗口换号，接着这段对话…' : '已新开窗口用新号接着聊，旧窗口可以关掉了');
  } catch (e) { toast('出错了：' + e); }
  setTimeout(loadRunning, 4000);
}
setInterval(loadRunning, 5000);

async function resume(idx, sel) {
  const s = sessions[idx];
  await pywebview.api.resume($(sel).value, s.id, s.cwd);
  toast('正在打开终端，接着这段对话…');
}

// 新增 / 编辑账号：Claude 和 Codex 共用一个对话框；新增时先选是哪种
let editKind = 'claude';
function setKind(k) {
  editKind = k;
  document.querySelectorAll('#fKindRow a').forEach(a => a.classList.toggle('on', a.dataset.k === k));
  document.querySelectorAll('.dialog .cl').forEach(l => l.style.display = k === 'claude' ? '' : 'none');  // Codex 号只有名字
  if (!editing) $('dlgHint').textContent = k === 'claude' ? '保存后点「开终端」登录，授权页会在这个号专属的 Chrome 里打开。'
    : '保存后点「登录」，在这个号专属的 Chrome 里登录 ChatGPT（要付费账号），验证码会自动复制好。';
}
function openEdit(id, kind = 'claude') {
  editing = id || null; delArmed = false;
  const a = (kind === 'codex' ? codexAccs : accounts).find(x => x.id === id) || {};
  $('dlgTitle').textContent = id ? '编辑账号' : '新增账号';
  $('fKindRow').style.display = id ? 'none' : '';  // 编辑时不能改种类
  $('fName').value = a.name || ''; $('fGroup').value = a.group || ''; $('fNote').value = a.note || '';
  $('dlgHint').textContent = '';
  setKind(kind);
  $('btnDel').style.display = id && id !== 'main' && id !== 'relay' ? '' : 'none';
  $('btnDel').textContent = '删除';
  $('mask').classList.add('show'); $('fName').focus();
}
function closeEdit() { $('mask').classList.remove('show'); }

async function saveAcc() {
  const name = $('fName').value.trim();
  if (!name) { $('fName').focus(); return; }
  if (editKind === 'codex') {
    if (editing) await pywebview.api.codex_rename(editing, name); else await pywebview.api.codex_add(name);
    closeEdit(); return loadCodex();
  }
  if (editing) await pywebview.api.update_account(editing, name, $('fGroup').value.trim(), $('fNote').value.trim());
  else await pywebview.api.add_account(name, $('fGroup').value.trim(), $('fNote').value.trim());
  closeEdit(); await refresh();
}

async function delAcc() {
  // 点两次才删，避免误删（不用浏览器弹框）
  if (!delArmed) { delArmed = true; $('btnDel').textContent = '再点一次确认删除'; return; }
  if (editKind === 'codex') { await pywebview.api.codex_remove(editing); closeEdit(); toast('已删除'); return loadCodex(); }
  await pywebview.api.remove_account(editing);
  closeEdit(); toast('已删除'); await refresh();
}

// 彩蛋：快速点 5 下左上角图标，或者在窗口里直接敲 clawd
let taps = [], typed = '';
function egg(force) {
  const now = Date.now();
  taps = taps.filter(t => now - t < 1500).concat(now);
  if (!force && taps.length < 5) return;
  taps = [];
  if (document.querySelector('.clawd')) return;
  const c = document.createElement('div'); c.className = 'clawd'; c.innerHTML = '<i></i>';
  document.body.appendChild(c); c.addEventListener('animationend', () => c.remove());
  toast('Clawd 出来巡逻了：今天的额度，它替你盯着');
}

document.addEventListener('keydown', e => {
  if ($('mask').classList.contains('show')) {
    if (e.key === 'Escape') closeEdit();
    if (e.key === 'Enter') saveAcc();
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  typed = (typed + e.key.toLowerCase()).slice(-5);
  if (typed === 'clawd') egg(true);
});

window.addEventListener('pywebviewready', async () => {
  await load();
  loadRunning(); loadCodex();
  const u = await pywebview.api.cached_usage();
  if (Object.keys(u).length) applyUsage(u);
});
</script>
</body>
</html>
